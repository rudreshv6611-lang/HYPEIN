<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HYPEIN</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">HYPEIN</div>

    <nav>
      <a href="#home">Home</a>
      <a href="#products">Products</a>
      <a href="#about">About</a>
    </nav>

    <button id="cartBtn">
      Cart (<span id="cartCount">0</span>)
    </button>
  </header>


  <main>

    <section id="home" class="hero">

      <div>
        <p class="eyebrow">NEW STREETWEAR</p>

        <h1>
          WEAR THE<br>
          <span>HYPE.</span>
        </h1>

        <p>Clean fits. Bold attitude. HYPEIN.</p>

        <a class="btn" href="#products">
          SHOP NOW
        </a>
      </div>

    </section>


    <section id="products" class="products-section">

      <h2>FEATURED PRODUCTS</h2>

      <div id="productGrid" class="product-grid">
      </div>

    </section>


    <section id="about" class="about">

      <h2>ABOUT HYPEIN</h2>

      <p>
        HYPEIN is a modern streetwear brand focused on
        clean designs and everyday confidence.
      </p>

    </section>

  </main>


  <footer>
    © 2026 HYPEIN. All rights reserved.
  </footer>


  <script src="script.js"></script>

</body>
</html>
